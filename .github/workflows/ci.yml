name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # pi 1.4.0 requires Node >= 22.19; "22" resolves to the latest 22.x.
          node-version: "22"
          cache: npm

      # Includes pi 1.4.0 itself (a devDependency): the type check and the loader tests use it.
      - name: Install dependencies
        run: npm ci

      - name: Type check (index.ts against pi's types)
        run: npm run typecheck

      # public/, mcp/schemas.json and THIRD_PARTY_NOTICES.md are build outputs that are committed
      # (pi installs packages without devDependencies, so it cannot build them). Rebuild and fail
      # when they differ from the commit, including new files the commit lacks.
      - name: Build outputs match the source
        run: |
          npm run build
          git diff --exit-code -- public mcp/schemas.json THIRD_PARTY_NOTICES.md
          untracked="$(git status --porcelain --untracked-files=all -- public mcp/schemas.json THIRD_PARTY_NOTICES.md)"
          if [ -n "$untracked" ]; then echo "Not committed after npm run build:"; echo "$untracked"; exit 1; fi

      # Before npm test, so test/mcp.test.mjs's board_snapshot check uses the same Chromium as the
      # browser tests (without a headless browser it skips that check and says why).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit, HTTP, hardening and MCP tests
        run: npm test

      - name: Browser tests
        run: npm run test:browser

      # The scripts load the extension through the pi in node_modules and make their own temp data dirs.
      - name: Pi loader and /reload tests
        run: npm run test:load

      - name: End to end (update, layout check, snapshot, export)
        run: node scripts/e2e-snapshot.mjs

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
