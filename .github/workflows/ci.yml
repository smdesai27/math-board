name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # pi 1.4.0 requires Node >= 22.19; "22" resolves to the latest 22.x.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Before npm test, so test/mcp.test.mjs's board_snapshot check uses the same Chromium as the
      # browser tests (without a headless browser it skips that check and says why).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit, HTTP, hardening and MCP tests
        run: npm test

      - name: Browser tests
        run: npm run test:browser

      # test:load finds pi through `npm root -g`; the scripts make their own temp data dirs.
      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent@1.4.0

      - name: Pi loader and /reload tests
        run: npm run test:load

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
